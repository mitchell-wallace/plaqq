name: auto-tag

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION change, create tag, and dispatch release
        run: |
          # Compare against the commit the branch pointed at before this push so a
          # VERSION bump is detected even when it isn't the most recent commit in
          # a multi-commit push. Fall back to HEAD~1 for a brand-new branch (the
          # "before" SHA is all-zeros or not fetched).
          base="${BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD~1"
          fi

          if git diff --quiet "$base" HEAD -- VERSION; then
            echo "VERSION file unchanged since $base, skipping."
            exit 0
          fi

          RAW_VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$RAW_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be a semantic version like 0.2.0, got: $RAW_VERSION"
            exit 1
          fi

          VERSION="v$RAW_VERSION"
          echo "VERSION changed to $VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "Tag $VERSION already exists on origin."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "Created and pushed tag $VERSION"
          fi

          echo "Dispatching release workflow for $VERSION"
          gh api "repos/{owner}/{repo}/actions/workflows/release.yml/dispatches" \
            --method POST \
            --field ref="$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
